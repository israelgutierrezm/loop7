user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    # Compresión básica de assets del SPA.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        server_name _;

        # Raíz: SPA estático compilado.
        root /var/www/spa;
        index index.html;

        # API, Sanctum, health y almacenamiento -> Laravel (public/index.php).
        location ~ ^/(api|sanctum|up|storage)(/|$) {
            root /var/www/html/public;
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            root /var/www/html/public;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
        }

        # Enrutado del SPA en modo history: cualquier ruta desconocida -> index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache larga para assets con hash del SPA.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Bloquea ficheros ocultos (salvo ACME).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
