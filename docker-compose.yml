# Stack completo de Loop7 con la imagen publicada en GHCR (o construida desde el
# Dockerfile). Variables: copia apps/backend/.env.example a .env (junto a este
# archivo) y ajusta los bloques [PROD]: APP_KEY, APP_URL, FRONTEND_URL, DB_*,
# REDIS_HOST=redis, QUEUE_CONNECTION/CACHE_STORE/SESSION_DRIVER=redis, etc.
#
#   docker compose up -d            # levanta todo
#   docker compose logs -f worker   # ver la cola
#
# Detrás de un proxy TLS (Caddy, Traefik, balanceador) expón sólo el puerto 8080
# y define TRUSTED_PROXIES en .env.

x-app: &app
  image: ghcr.io/israelgutierrezm/loop7:${LOOP7_VERSION:-latest}
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "8080:8080"
    environment:
      RUN_MIGRATIONS: "true"

  # Procesa publicaciones, sincronizaciones, webhooks y automatizaciones.
  worker:
    <<: *app
    entrypoint: ["php", "artisan", "queue:work", "--queue=publishing,default,inbox,analytics,automations", "--sleep=2", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true

  # Tareas programadas (publicación vencida cada minuto, métricas, inbox, tokens, suscripciones).
  scheduler:
    <<: *app
    entrypoint: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-loop7}
      MYSQL_USER: ${DB_USERNAME:-loop7}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

volumes:
  storage:
  mysql:
  redis:
